<script src="/scripts.js"></script> 
<h1>Static Web Apps Database Connections</h1>
<blockquote>
    Open the console in the browser developer tools to see the API responses.
</blockquote>
<div>
    <select id="tableSelect">
  <option value="customer" selected= "selected">customer</option>
  <option value="employee">employee</option>
    </select>
    <button id="list" onclick="list(document.getElementById('tableSelect').value)">List</button>
    <button id="get" onclick="get(document.getElementById('tableSelect').value)">Get</button>
    <button id="create" onclick="create(document.getElementById('tableSelect').value, document.getElementById('fname').value, document.getElementById('lname').value, document.getElementById('address').value, document.getElementById('mobile').value, document.getElementById('email').value)">Create</button>
    <button id="delete" onclick="del()">Delete</button>
    <select id="filter">
        <option value="id" selected= "selected">ID</option>
        <option value="lname">lname</option>
    </select>
    <input type="text" id="search" name="search">
    <br>
    for user update:
    <br>
    <button id="update" onclick="update(document.getElementById('tableSelect').value, document.getElementById('id2').value, document.getElementById('fname').value, document.getElementById('lname').value, document.getElementById('address').value, document.getElementById('mobile').value, document.getElementById('email').value)">Update</button>
    <input type="number" id="id2" name="id" value="1"></intup>
    <input type="text" id="fname" name="fname" value="John"></intup>
    <input type="text" id="lname" name="lname" value="Doe"></intup>
    <input type="text" id="address" name="address" value="123 Main St, City, Country"></intup>
    <input type="number" id="mobile" name="mobile" value="01234567890"></intup>
    <input type="text" id="email" name="email" value="john.doe@example.com"></intup>
</div>
